<!doctype html>
<html lang="en" data-theme="ideavault-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IdeaVault is a platform where students and founders share startup ideas, get feedback and find collaborators."
    />
    <title>IdeaVault | Startup Idea Sharing Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before React loads so the page never flashes the wrong colors -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ideavault-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', 'ideavault-' + theme)
        } catch (error) {
          /* localStorage can be blocked; the default light theme stays */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
